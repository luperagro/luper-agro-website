<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - LUPER AGRO LIMITED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --agro-green-dark: #0d2e1a;
            --agro-green-primary: #1a4a2e;
            --gold-primary: #c9a84c;
            --font-primary: 'Inter', sans-serif;
            --font-heading: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-primary); color: #1a1715; background: #f8f7f5; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: var(--agro-green-primary); transition: all 0.3s ease; }
        
        .btn-primary { background: var(--agro-green-primary); color: white; padding: 0.9rem 2.5rem; border-radius: 50px; border: none; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary:hover { background: var(--agro-green-dark); color: white; transform: translateY(-3px); }
        .btn-outline-primary { background: transparent; color: var(--agro-green-primary); border: 2px solid var(--agro-green-primary); padding: 0.9rem 2.5rem; border-radius: 50px; font-weight: 600; transition: all 0.3s ease; }
        .btn-outline-primary:hover { background: var(--agro-green-primary); color: white; transform: translateY(-3px); }
        
        .error-section { padding: 5rem 0; min-height: 70vh; display: flex; align-items: center; }
        .error-number { font-size: 8rem; font-weight: 900; color: var(--agro-green-primary); line-height: 1; }
        
        @media (max-width: 768px) {
            .error-number { font-size: 5rem; }
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-white" style="padding: 0.6rem 0; border-bottom: 1px solid rgba(26, 74, 46, 0.05);">
    <div class="container">
        <a class="navbar-brand" href="index.html" style="display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-heading); font-weight: 800; font-size: 1.6rem; color: #1a1715;">
            <span style="color: var(--gold-primary); font-size: 1.8rem; background: #f0e6c8; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i class="fas fa-seedling"></i></span>
            <span>LUPER <span style="color: var(--agro-green-primary);">AGRO</span></span>
        </a>
    </div>
</nav>

<!-- Error Section -->
<section class="error-section">
    <div class="container">
        <div class="row justify-content-center text-center">
            <div class="col-lg-6">
                <div class="error-number">404</div>
                <h1 class="display-4 mb-3" style="font-weight: 700;">Page Not Found</h1>
                <p class="lead mb-4" style="color: #5a5550;">Oops! The page you are looking for doesn't exist or has been moved.</p>
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <a href="index.html" class="btn btn-primary"><i class="fas fa-home me-2"></i>Go Home</a>
                    <a href="contact.html" class="btn btn-outline-primary">Contact Us</a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer style="background: var(--agro-green-dark); color: rgba(255,255,255,0.4); padding: 2rem 0; margin-top: auto;">
    <div class="container text-center">
        <p style="font-size: 0.85rem; margin: 0;">&copy; 2026 LUPER AGRO LIMITED. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
